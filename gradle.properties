org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=bsp_rankup
mod_name=BSP RankUp
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.mrgregles.bsp_rankup
mod_authors=Mrgregles
mod_description=Automatic LuckPerms ranks for the Build Secure Protect (BSP) modpack, raised by playtime, kills, totems stolen and protected, and more. Companion to BSP Core.
mod_archive_name=bsp-rankup

# BSP-Core is compiled against from the sibling repo's built jar (no published artifact). Build BSP-Core first.
bsp_core_version=1.1.0
bsp_core_version_range=[1.1.0,)
bsp_core_libs=../BSP-Core/build/libs

# BSP Region Guard is optional at runtime; compiled against its api package only, from its sibling repo's built jar.
region_guard_version=0.1.0
region_guard_version_range=[0.1.0,)
region_guard_libs=../BSP-Region Guard/build/libs

# BSP-Teleport is optional at runtime; nothing is compiled against it.
bsp_teleport_version_range=[0.1.0,)

# LuckPerms API (compile only; present at runtime only when the server runs LuckPerms).
luckperms_api_version=5.4
